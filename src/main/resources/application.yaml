spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: FootGamers
  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  security:
    oauth2:
      client:
        # Las credenciales SIEMPRE vienen de variables de entorno. Si faltan,
        # `OAuth2ClientConfig` omite el proveedor y el login normal sigue igual.
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
          discord:
            client-id: ${DISCORD_CLIENT_ID}
            client-secret: ${DISCORD_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: identify,email
        provider:
          discord:
            authorization-uri: https://discord.com/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: username

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

almacen:
  imagenes:
    directorio: ${IMAGENES_DIR}
    formatos-permitidos: ${IMAGENES_FORMATOS}
    tamano-maximo-bytes: 2097152

app:
  oauth:
    # A donde redirige el backend tras un login OAuth correcto.
    frontend-url: ${FRONTEND_URL}